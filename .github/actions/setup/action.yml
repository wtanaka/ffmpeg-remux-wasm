name: Set up the build machine
description: >
  Runs .ci/setup-ubuntu.sh (Emscripten, dprint, shfmt, git-cliff,
  committed),
  caching what it installs, and puts the tools on the PATH for the steps that
  follow.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        # Everything the script writes, so a restored cache is a finished
        # setup (its stamp file is in the cache too, and the script then exits
        # at once).
        path: |
          ~/emsdk
          ~/.cache/ffmpeg-remux-wasm
          ~/.local/bin/shfmt
          ~/.cargo/bin/dprint
          ~/.cargo/bin/git-cliff
          ~/.cargo/bin/committed
          ~/.cargo/bin/cargo-binstall
        key: >-
          setup-${{ runner.os }}-${{ hashFiles('.ci/*',
          'ffmpeg/EMSCRIPTEN_VERSION') }}
    - name: Run .ci/setup-ubuntu.sh
      shell: sh
      run: sh .ci/setup-ubuntu.sh
    # Not in the cache (rustup keeps it elsewhere), so on every run; it does
    # nothing once the target is there.
    - name: Add the Rust target that check-module builds for
      shell: sh
      run: rustup target add wasm32-unknown-emscripten
    - name: Put the tools on the PATH
      shell: sh
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # The wasm task loads the Emscripten environment from here.
        echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
