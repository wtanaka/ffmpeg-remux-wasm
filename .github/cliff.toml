# git-cliff writes the release notes from the commit messages (Conventional
# Commits). `cargo xtask ci-publish-release` runs it; to preview what the next
# release would say: git cliff --config .github/cliff.toml --unreleased
#
# The headings are ordered by the number in the comment before each name, which
# the template strips. Scopes with their own heading: `exports` (the functions the module exposes),
# `ffmpeg` (the FFmpeg version) and `emscripten` (the Emscripten version).

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking %} (breaking){% endif %}
{% endfor %}
{% endfor -%}
{% if previous.version -%}
**Full changelog**: https://github.com/{{ get_env(name="GITHUB_REPOSITORY", default="wtanaka/ffmpeg-remux-wasm") }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^[a-z]+\\(exports\\)", group = "<!-- 0 -->Exported functions" },
  { message = "^[a-z]+\\(ffmpeg\\)", group = "<!-- 1 -->FFmpeg" },
  { message = "^[a-z]+\\(emscripten\\)", group = "<!-- 2 -->Emscripten" },
  { message = "^feat", group = "<!-- 3 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^perf", group = "<!-- 5 -->Changed" },
  { message = "^(docs|style|test|ci|chore|refactor|build)", skip = true },
  { message = ".*", group = "<!-- 6 -->Other" },
]
